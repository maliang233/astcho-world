[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astcho-world"
version = "0.1.0"
description = "An extensible environment for Astcho, with isolated applications"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "jsonschema>=4.20,<5", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
agent = ["openai>=1.50,<3", "deepseek-harness-sdk==0.2.1rc2"]
host = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "nonebot2>=2.4,<3", "nonebot-adapter-onebot>=2.4,<3"]
legacy = [
  "nonebot2[fastapi]>=2.4,<3", "nonebot-adapter-onebot>=2.4,<3",
  "openai>=1.50,<3", "chromadb>=1.0,<2", "sentence-transformers>=3,<6",
  "python-dotenv>=1.0,<2", "httpx>=0.27,<1",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
astcho-world = "astcho_world.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/astcho_world/vendor/*.py" = ["E501"]

[tool.setuptools.package-data]
astcho_world = ["web/*.html", "web/*.css", "web/*.js", "web/*.png", "prompts/*.md", "dsh/*.mjs", "vendor/*.txt"]
